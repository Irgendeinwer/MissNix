[workspace]
members = ["crates/missnix-core", "."]
resolver = "3"

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Irgendeinwer/MissNix"

[package]
name = "missnix"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A desktop release radar for your local music library — scan your folders, track favorite artists, and miss nothing."
repository.workspace = true
readme = "README.md"
keywords = ["music", "releases", "slint", "musicbrainz", "deezer"]
categories = ["multimedia::audio", "gui"]
default-run = "missnix"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2.191"
libloading = "0.9.1"
missnix-core = { path = "crates/missnix-core" }
nanomp3 = "0.2.0"
open = "5.4.5"
slint = { version = "1.19.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "image-default-formats",
] }

[build-dependencies]
slint-build = "1.19.1"

[profile.release]
opt-level = 2
codegen-units = 16
strip = "debuginfo"
