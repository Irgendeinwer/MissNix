name: Sync Locks & Verify Upgrade

on:
  push:
    branches:
      - arena/6e824dad-missnix

permissions:
  contents: write

jobs:
  sync-and-verify:
    name: Update Cargo.lock + flake.lock, Edition 2024 Check & AppImage Smoke Test
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(deps): lock')"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: arena/6e824dad-missnix
          fetch-depth: 0

      - name: Install system build and GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            cmake \
            file \
            desktop-file-utils \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxcb1-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run cargo update & nix flake update
        run: |
          set -o pipefail
          if ! cargo update 2>&1 | tee /tmp/update.log; then
            MSG=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/update.log | tail -n 30 | cut -c1-240 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=cargo update failed::${MSG}"
            exit 1
          fi
          nix flake update

      - name: Auto-apply Edition 2024 idioms, rustfmt, Clippy & Tests
        run: |
          set -o pipefail
          cargo fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          if ! cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy.log; then
            MSG=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/clippy.log | tail -n 35 | cut -c1-240 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=cargo clippy failed::${MSG}"
            exit 1
          fi
          if ! cargo test --workspace --locked 2>&1 | tee /tmp/test.log; then
            MSG=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | tail -n 35 | cut -c1-240 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=cargo test failed::${MSG}"
            exit 1
          fi

      - name: Smoke-test release binary & portable AppImage packaging
        run: |
          set -euo pipefail
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          BIN="target/x86_64-unknown-linux-gnu/release/missnix"
          ldd "$BIN"

          mkdir -p /tmp/appimg/MissNix.AppDir/usr/bin \
                   /tmp/appimg/MissNix.AppDir/usr/share/applications \
                   /tmp/appimg/MissNix.AppDir/usr/share/icons/hicolor/scalable/apps

          cat > /tmp/appimg/missnix.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=MissNix
          GenericName=Music Release Radar
          Comment=Scan your local music folders, track favorite artists, and miss nothing
          Exec=missnix
          Icon=missnix
          Terminal=false
          Categories=AudioVideo;Audio;Music;
          Keywords=music;releases;albums;deezer;musicbrainz;
          EOF
          desktop-file-validate /tmp/appimg/missnix.desktop

          install -m755 "$BIN" /tmp/appimg/MissNix.AppDir/usr/bin/missnix
          install -m644 /tmp/appimg/missnix.desktop /tmp/appimg/MissNix.AppDir/missnix.desktop
          install -m644 /tmp/appimg/missnix.desktop /tmp/appimg/MissNix.AppDir/usr/share/applications/missnix.desktop
          install -m644 assets/missnix.svg /tmp/appimg/MissNix.AppDir/missnix.svg
          install -m644 assets/missnix.svg /tmp/appimg/MissNix.AppDir/usr/share/icons/hicolor/scalable/apps/missnix.svg
          ln -sf missnix.svg /tmp/appimg/MissNix.AppDir/.DirIcon

          cat > /tmp/appimg/MissNix.AppDir/AppRun << 'EOF'
          #!/bin/sh
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "${HERE}/usr/bin/missnix" "$@"
          EOF
          chmod 755 /tmp/appimg/MissNix.AppDir/AppRun

          curl -fsSL --retry 3 \
            -o /tmp/appimg/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimg/appimagetool-x86_64.AppImage

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            /tmp/appimg/appimagetool-x86_64.AppImage \
            /tmp/appimg/MissNix.AppDir \
            /tmp/appimg/missnix-v0.1.0-linux-x86_64.AppImage

          chmod +x /tmp/appimg/missnix-v0.1.0-linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimg/missnix-v0.1.0-linux-x86_64.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimg/missnix-v0.1.0-linux-x86_64.AppImage --help

      - name: Commit updated lockfiles & Edition 2024 formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): lock latest Cargo + Nix dependencies and format for Rust 2024"
            git push origin HEAD:arena/6e824dad-missnix
          fi
