name: Release

on:
  # 1) Automatic trigger on a release commit pushed to `main`, e.g.:
  #      git commit -m "release: v0.2.0"
  #      git commit -m "chore(release): v0.2.0"
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

  # 2) Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0 — must match Cargo.toml version)"
        required: true
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve & Validate Release Target
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.event.head_commit.message, 'release: v') ||
      startsWith(github.event.head_commit.message, 'chore(release): v')
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and verify immutable version tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -n1)
            TAG=$(printf '%s' "$FIRST_LINE" | sed -E 's/^(release|chore\(release\)):[[:space:]]*(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?).*$/\2/')
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release tag '$TAG' (expected semver tag like v0.2.0)"
            exit 1
          fi

          VERSION="${TAG#v}"
          ROOT_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          CORE_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/missnix-core/Cargo.toml","rb"))["package"]["version"])')

          if [ "$ROOT_VER" != "$VERSION" ] || [ "$CORE_VER" != "$VERSION" ]; then
            echo "::error::Tag $TAG ($VERSION) does not match Cargo.toml ($ROOT_VER) / missnix-core ($CORE_VER)"
            exit 1
          fi

          # Enforce immutability: never overwrite an already published release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Releases are immutable — bump version for a new release."
            exit 1
          fi

          # If the tag already exists in git, verify it points to this exact commit
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Existing git tag $TAG points to $TAG_SHA, not $GITHUB_SHA. Refusing to mutate tag."
              exit 1
            fi
          fi

          PRERELEASE="false"
          if [ "$INPUT_PRERELEASE" = "true" ] || printf '%s' "$VERSION" | grep -q '-'; then
            PRERELEASE="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Validated immutable release target: $TAG (commit $GITHUB_SHA)"

  release-linux-x86_64:
    name: Build, Attest & Publish (${{ needs.prepare.outputs.tag }})
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install system build and GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            cmake \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxcb1-dev \
            libgl1-mesa-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting, lints & unit tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build stripped release binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          BIN="target/x86_64-unknown-linux-gnu/release/missnix"
          "$BIN" --version | grep -qx "missnix ${{ needs.prepare.outputs.version }}"

      - name: Package release archive & SHA256SUMS
        id: pkg
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          STAGE="missnix-${TAG}-x86_64-unknown-linux-gnu"
          ARCHIVE="${STAGE}.tar.gz"

          mkdir -p "dist/${STAGE}/bin" \
                   "dist/${STAGE}/share/icons/hicolor/scalable/apps" \
                   "dist/${STAGE}/share/applications"

          install -m755 "target/x86_64-unknown-linux-gnu/release/missnix" "dist/${STAGE}/bin/missnix"
          install -m644 assets/missnix.svg "dist/${STAGE}/share/icons/hicolor/scalable/apps/missnix.svg"
          install -m644 README.md LICENSE "dist/${STAGE}/"

          cat > "dist/${STAGE}/share/applications/missnix.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=MissNix
          GenericName=Music Release Tracker
          Comment=Track new releases from artists in your local music library
          Exec=missnix
          Icon=missnix
          Terminal=false
          Categories=AudioVideo;Audio;Music;
          Keywords=music;releases;albums;deezer;musicbrainz;
          EOF

          tar -C dist -czf "dist/${ARCHIVE}" "${STAGE}"
          (cd dist && sha256sum "${ARCHIVE}" > SHA256SUMS)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/SHA256SUMS

      - name: Create immutable git tag & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
        run: |
          set -euo pipefail

          # Create refs/tags/$TAG pointing to $GITHUB_SHA if triggered via release commit or dispatch
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}"
          fi

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              "dist/${ARCHIVE}" \
              "dist/SHA256SUMS" \
              --verify-tag \
              --title "MissNix ${TAG}" \
              --generate-notes \
              --prerelease
          else
            gh release create "$TAG" \
              "dist/${ARCHIVE}" \
              "dist/SHA256SUMS" \
              --verify-tag \
              --title "MissNix ${TAG}" \
              --generate-notes
          fi
