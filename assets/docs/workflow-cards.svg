<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 268" width="920" height="268" role="img" aria-label="How MissNix works: sync your library, discover releases, and listen">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172237"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#17293a"/>
      <stop offset="0.55" stop-color="#20253c"/>
      <stop offset="1" stop-color="#2b223b"/>
    </linearGradient>
  </defs>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <g transform="translate(0 0)">
      <rect width="294" height="168" rx="18" fill="url(#card)" stroke="#395470" stroke-width="1.2"/>
      <rect x="20" y="20" width="36" height="36" rx="11" fill="#1b424e" stroke="#4ea8b5"/>
      <text x="38" y="44" text-anchor="middle" font-size="14" font-weight="800" fill="#9ff4f1">01</text>
      <text x="68" y="35" font-size="10.5" font-weight="750" letter-spacing="0.8" fill="#75dfe7">YOUR LIBRARY</text>
      <text x="68" y="54" font-size="16" font-weight="800" fill="#f4f7ff">Find your artists</text>
      <text x="20" y="86" font-size="12.5" fill="#cad5e6">Choose your music folders. MissNix</text>
      <text x="20" y="105" font-size="12.5" fill="#cad5e6">finds the artists in your collection</text>
      <text x="20" y="124" font-size="12.5" fill="#cad5e6">and recognizes albums you already</text>
      <text x="20" y="143" font-size="12.5" fill="#cad5e6">own on disk.</text>
    </g>

    <g transform="translate(313 0)">
      <rect width="294" height="168" rx="18" fill="url(#card)" stroke="#554c7b" stroke-width="1.2"/>
      <rect x="20" y="20" width="36" height="36" rx="11" fill="#393057" stroke="#8c77bf"/>
      <text x="38" y="44" text-anchor="middle" font-size="14" font-weight="800" fill="#ded1ff">02</text>
      <text x="68" y="35" font-size="10.5" font-weight="750" letter-spacing="0.8" fill="#c6afff">RELEASE RADAR</text>
      <text x="68" y="54" font-size="16" font-weight="800" fill="#f4f7ff">Catch new releases</text>
      <text x="20" y="86" font-size="12.5" fill="#cad5e6">Discover albums, EPs, and singles</text>
      <text x="20" y="105" font-size="12.5" fill="#cad5e6">from Deezer and MusicBrainz —</text>
      <text x="20" y="124" font-size="12.5" fill="#cad5e6">including upcoming releases, with</text>
      <text x="20" y="143" font-size="12.5" fill="#cad5e6">no accounts or API keys.</text>
    </g>

    <g transform="translate(626 0)">
      <rect width="294" height="168" rx="18" fill="url(#card)" stroke="#714e69" stroke-width="1.2"/>
      <rect x="20" y="20" width="36" height="36" rx="11" fill="#51303e" stroke="#bb758e"/>
      <text x="38" y="44" text-anchor="middle" font-size="14" font-weight="800" fill="#ffd8de">03</text>
      <text x="68" y="35" font-size="10.5" font-weight="750" letter-spacing="0.8" fill="#ffadbf">LISTEN &amp; CURATE</text>
      <text x="68" y="54" font-size="16" font-weight="800" fill="#f4f7ff">Preview and save</text>
      <text x="20" y="86" font-size="12.5" fill="#cad5e6">Play 30-second previews, mark</text>
      <text x="20" y="105" font-size="12.5" fill="#cad5e6">releases seen, or mute artists</text>
      <text x="20" y="124" font-size="12.5" fill="#cad5e6">right from the details panel.</text>
    </g>

    <g transform="translate(0 186)">
      <rect width="920" height="82" rx="18" fill="url(#footer)" stroke="#4b526d" stroke-width="1.2"/>
      <text x="24" y="34" font-size="14" font-weight="800" fill="#f4f7ff">Make it yours</text>
      <text x="24" y="55" font-size="12" fill="#d0d9e9">Dark &amp; light themes · Flexible scaling · Custom accents</text>
      <g transform="translate(552 23)">
        <rect width="344" height="36" rx="18" fill="#101827" fill-opacity="0.8" stroke="#4c576d"/>
        <circle cx="26" cy="18" r="7" fill="#b9a5ff"/>
        <circle cx="53" cy="18" r="7" fill="#70d8fb"/>
        <circle cx="80" cy="18" r="7" fill="#6fe2bb"/>
        <circle cx="107" cy="18" r="7" fill="#ffbe75"/>
        <circle cx="134" cy="18" r="7" fill="#ff9fb0"/>
        <circle cx="161" cy="18" r="7" fill="#e4e7ee"/>
        <text x="186" y="22" font-size="11" font-weight="700" fill="#e7edf9">+ your own #HEX</text>
      </g>
    </g>
  </g>
</svg>
