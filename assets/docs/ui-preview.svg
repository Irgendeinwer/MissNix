    <line x1="189" y1="5" x2="189" y2="555" stroke="#2c293b"/>

    <!-- Brand header -->
    <rect x="19" y="20" width="34" height="34" rx="10" fill="#352b54" stroke="#d0bcff" stroke-opacity="0.45"/>
    <circle cx="36" cy="37" r="11" fill="none" stroke="#d0bcff" stroke-width="1.8"/>
    <circle cx="36" cy="37" r="3" fill="#d0bcff"/>
    <text x="62" y="35" font-size="14" font-weight="800" fill="#f2eef8">MissNix</text>
    <text x="62" y="48" font-size="10" fill="#8f89a3">Release Radar</text>

    <!-- Nav Items (3 destinations) -->
    <rect x="17" y="70" width="160" height="36" rx="18" fill="#372d56"/>
    <rect x="14" y="79" width="3" height="18" rx="1.5" fill="#d0bcff"/>
    <text x="44" y="92" font-size="12" font-weight="700" fill="#ebddff">Release Radar</text>
    <rect x="145" y="79" width="24" height="18" rx="9" fill="#d0bcff"/>
    <text x="157" y="92" font-size="10" font-weight="700" fill="#231742" text-anchor="middle">7</text>

    <text x="44" y="132" font-size="12" font-weight="500" fill="#b4aec7">Tracked Artists</text>
    <text x="44" y="170" font-size="12" font-weight="500" fill="#b4aec7">Library &amp; Settings</text>

    <!-- Bottom Rail Buttons & Status -->
