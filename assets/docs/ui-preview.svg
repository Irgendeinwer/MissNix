    <circle cx="856" cy="120" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

    <text x="752" y="220" font-size="15" font-weight="800" fill="#f3effa">Phantom Circuit</text>
    <text x="752" y="237" font-size="12" font-weight="600" fill="#d0bcff">Bicep</text>
    <text x="752" y="252" font-size="10" fill="#8f89a3">Released 2026-11-20 · DEEZER · MB</text>

