    <text x="44" y="135" font-size="12" font-weight="500" fill="#cfb6ab">Tracked Artists</text>
    <text x="44" y="173" font-size="12" font-weight="500" fill="#cfb6ab">Library &amp; Settings</text>

    <!-- Bottom Sync Actions & Multi-Line Library Telemetry Card -->
    <rect x="17" y="406" width="168" height="34" rx="17" fill="#ffb596"/>
    <text x="101" y="427" font-size="11.5" font-weight="700" fill="#461600" text-anchor="middle">Check Releases</text>

