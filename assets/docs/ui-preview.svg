    <rect x="890" y="264" width="70" height="28" rx="14" fill="none" stroke="#3c3750"/>
    <text x="925" y="282" font-size="10.5" fill="#d8d2e8" text-anchor="middle">Dismiss</text>

    <rect x="752" y="298" width="102" height="26" rx="13" fill="none" stroke="#3c3750"/>
