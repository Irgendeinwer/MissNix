    <rect x="752" y="298" width="102" height="26" rx="13" fill="none" stroke="#4f3a30"/>
    <text x="803" y="315" font-size="10" font-weight="600" fill="#dec4b9" text-anchor="middle">Mute Artist</text>
    <rect x="860" y="298" width="100" height="26" rx="13" fill="#4c1f24"/>
    <text x="910" y="315" font-size="10" font-weight="600" fill="#fecdd3" text-anchor="middle">Hide Artist</text>

    <line x1="752" y1="336" x2="960" y2="336" stroke="#382821"/>
