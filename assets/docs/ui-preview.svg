    <text x="97" y="438" font-size="11.5" font-weight="700" fill="#231742" text-anchor="middle">Check Releases</text>

    <rect x="17" y="458" width="160" height="32" rx="16" fill="#2a2738"/>
    <text x="97" y="478" font-size="11.5" font-weight="600" fill="#ddd6ee" text-anchor="middle">Scan Music Folders</text>

    <rect x="17" y="498" width="160" height="44" rx="10" fill="#1f1d2a" stroke="#2f2b3f"/>
    <text x="27" y="516" font-size="10" font-weight="700" fill="#ebe6f5">142 tracked artists · 486 albums</text>
    <text x="27" y="531" font-size="9.5" fill="#948ea8">Checked 142 artists · 7 new drops</text>

