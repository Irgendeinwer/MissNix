<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="MissNix Desktop Interface Overview">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14131a"/>
      <stop offset="100%" stop-color="#111016"/>
    </linearGradient>
    <linearGradient id="cov1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a5e"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="cov2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cov3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="cov4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#581c4f"/>
      <stop offset="100%" stop-color="#27223a"/>
    </linearGradient>
    <linearGradient id="cov5" x1="0" y1="0" x2="1" y2="1">
