    <text x="446" y="81" font-size="10" fill="#bcb6cf" text-anchor="middle">Unread (7)</text>

    <rect x="484" y="63" width="64" height="28" rx="7" fill="#1e1c28" stroke="#302c40"/>
    <text x="516" y="81" font-size="10" fill="#bcb6cf" text-anchor="middle">Upcoming</text>

    <line x1="555" y1="68" x2="555" y2="86" stroke="#322e42"/>

