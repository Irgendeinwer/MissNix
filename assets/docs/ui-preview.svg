    <text x="101" y="469" font-size="11.5" font-weight="600" fill="#f0dcd3" text-anchor="middle">Scan Music Folders</text>

    <rect x="17" y="490" width="168" height="60" rx="11" fill="#261c17" stroke="#3d2d25"/>
    <text x="28" y="509" font-size="10.5" font-weight="700" fill="#f5e4dd">155 tracked artists</text>
    <text x="28" y="524" font-size="10.5" font-weight="700" fill="#f5e4dd">1,075 local albums</text>
    <text x="28" y="540" font-size="9.5" fill="#a88f84">Checked 155 artists · 9 new drops</text>

