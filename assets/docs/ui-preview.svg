    <rect x="5" y="5" width="192" height="558" rx="15" fill="#1c1410"/>
    <line x1="197" y1="5" x2="197" y2="563" stroke="#382821"/>

    <!-- Brand Header -->
    <rect x="19" y="20" width="36" height="36" rx="11" fill="#471d0b" stroke="#ffb596" stroke-opacity="0.48"/>
    <circle cx="37" cy="38" r="11.5" fill="none" stroke="#ffb596" stroke-width="1.8"/>
    <line x1="37" y1="38" x2="45" y2="30" stroke="#ea6c34" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="37" cy="38" r="3" fill="#ffdbcd"/>
    <text x="65" y="36" font-size="14.5" font-weight="800" fill="#f5e4dd">MissNix</text>
    <text x="65" y="49" font-size="10" fill="#a48c81">Release Radar</text>

    <!-- 3 Navigation Destinations -->
