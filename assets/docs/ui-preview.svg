    <rect x="390" y="517" width="3" height="12" rx="1" fill="#231742"/>
    <rect x="395" y="517" width="3" height="12" rx="1" fill="#231742"/>
    <text x="420" y="527" font-size="9.5" font-weight="600" fill="#bcb6cf">0:14</text>
    <rect x="448" y="520" width="164" height="6" rx="3" fill="#322e45"/>
    <rect x="448" y="520" width="78" height="6" rx="3" fill="#d0bcff"/>
    <circle cx="526" cy="523" r="5.5" fill="#d0bcff"/>
    <text x="620" y="527" font-size="9.5" fill="#8b85a0">0:30</text>
    <rect x="664" y="521" width="46" height="4" rx="2" fill="#322e45"/>
    <rect x="664" y="521" width="36" height="4" rx="2" fill="#b4aec7"/>

