    <linearGradient id="cov1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="55%" stop-color="#5c2208"/>
      <stop offset="100%" stop-color="#1f1613"/>
    </linearGradient>
    <linearGradient id="cov2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#291d18"/>
    </linearGradient>
    <linearGradient id="cov3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="cov4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b2137"/>
      <stop offset="100%" stop-color="#251a16"/>
    </linearGradient>
    <linearGradient id="cov5" x1="0" y1="0" x2="1" y2="1">
