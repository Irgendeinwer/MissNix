    <rect x="918" y="366" width="38" height="18" rx="9" fill="#32231c"/>
    <text x="937" y="378" font-size="9" font-weight="700" fill="#ffb596" text-anchor="middle">30s</text>

    <rect x="750" y="388" width="210" height="27" rx="8" fill="#5c2208" fill-opacity="0.72"/>
    <text x="756" y="405" font-size="10.5" font-weight="700" fill="#ffdbcd">02  Terracotta Pulse</text>
    <rect x="918" y="392" width="38" height="18" rx="9" fill="#ffb596"/>
    <text x="937" y="404" font-size="9" font-weight="700" fill="#461600" text-anchor="middle">❚❚</text>

    <text x="756" y="432" font-size="10.5" fill="#d5bcb0">03  Cinder Loop</text>
    <rect x="918" y="420" width="38" height="18" rx="9" fill="#32231c"/>
    <text x="937" y="432" font-size="9" font-weight="700" fill="#ffb596" text-anchor="middle">30s</text>

    <text x="756" y="458" font-size="10.5" fill="#d5bcb0">04  Warm Static</text>
    <rect x="918" y="446" width="38" height="18" rx="9" fill="#32231c"/>
    <text x="937" y="458" font-size="9" font-weight="700" fill="#ffb596" text-anchor="middle">30s</text>

    <!-- Solid Inspector Scrollbar -->
    <rect x="965" y="346" width="5.5" height="96" rx="2.75" fill="#a48c81" fill-opacity="0.75"/>
