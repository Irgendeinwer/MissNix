    <rect x="376" y="63" width="38" height="28" rx="8" fill="#5c2208" stroke="#c86538"/>
    <text x="395" y="81" font-size="10" font-weight="700" fill="#ffdbcd" text-anchor="middle">All</text>

    <rect x="419" y="63" width="66" height="28" rx="8" fill="#231915" stroke="#3c2c25"/>
    <text x="452" y="81" font-size="10" fill="#d5bcb0" text-anchor="middle">Unread (9)</text>

