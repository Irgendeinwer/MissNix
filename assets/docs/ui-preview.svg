    <circle cx="856" cy="120" r="42" fill="none" stroke="#ffdbcd" stroke-opacity="0.22" stroke-width="1.5"/>

    <text x="752" y="220" font-size="15" font-weight="800" fill="#f6e5de">Amber Horizon</text>
