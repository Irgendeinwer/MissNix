    <rect x="860" y="298" width="100" height="26" rx="13" fill="#462228"/>
    <text x="910" y="315" font-size="10" font-weight="600" fill="#fecdd3" text-anchor="middle">Hide Artist</text>

    <line x1="752" y1="336" x2="960" y2="336" stroke="#2c293b"/>
    <text x="752" y="354" font-size="11" font-weight="700" fill="#e6e1f2">Tracklist · Click 30s Preview</text>

    <!-- Tracklist rows -->
    <text x="756" y="378" font-size="10.5" fill="#bcb6cf">01  Helios</text>
    <rect x="920" y="366" width="38" height="18" rx="9" fill="#2a2738"/>
    <text x="939" y="378" font-size="9" font-weight="700" fill="#d0bcff" text-anchor="middle">30s</text>

    <rect x="750" y="388" width="212" height="26" rx="7" fill="#352b54" fill-opacity="0.65"/>
    <text x="756" y="405" font-size="10.5" font-weight="700" fill="#ebddff">02  Chroma</text>
    <rect x="920" y="392" width="38" height="18" rx="9" fill="#d0bcff"/>
    <text x="939" y="404" font-size="9" font-weight="700" fill="#231742" text-anchor="middle">❚❚</text>

    <text x="756" y="432" font-size="10.5" fill="#bcb6cf">03  Velvet Static</text>
    <rect x="920" y="420" width="38" height="18" rx="9" fill="#2a2738"/>
    <text x="939" y="432" font-size="9" font-weight="700" fill="#d0bcff" text-anchor="middle">30s</text>

    <text x="756" y="458" font-size="10.5" fill="#bcb6cf">04  Driftline</text>
    <rect x="920" y="446" width="38" height="18" rx="9" fill="#2a2738"/>
    <text x="939" y="458" font-size="9" font-weight="700" fill="#d0bcff" text-anchor="middle">30s</text>
