<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 204" width="920" height="204" role="img" aria-label="MissNix — Local Music Release Radar">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111a2d"/>
      <stop offset="0.55" stop-color="#101625"/>
      <stop offset="1" stop-color="#17152c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70e5ee"/>
      <stop offset="0.52" stop-color="#90c5ff"/>
      <stop offset="1" stop-color="#bd9cff"/>
    </linearGradient>
    <radialGradient id="left-glow">
      <stop stop-color="#46b8df" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#46b8df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="right-glow">
      <stop stop-color="#9a70fa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9a70fa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="920" height="204" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="920" height="204" fill="url(#background)"/>
    <ellipse cx="98" cy="105" rx="264" ry="180" fill="url(#left-glow)"/>
    <ellipse cx="828" cy="98" rx="250" ry="185" fill="url(#right-glow)"/>
    <g fill="none" stroke="#a9bbef">
      <circle cx="843" cy="102" r="53" opacity="0.25"/>
      <circle cx="843" cy="102" r="87" opacity="0.18" stroke-dasharray="5 9"/>
      <circle cx="843" cy="102" r="122" opacity="0.11"/>
      <circle cx="843" cy="102" r="158" opacity="0.07"/>
    </g>
    <circle cx="806" cy="64" r="4" fill="#8be8e9" opacity="0.9"/>
    <circle cx="768" cy="134" r="3" fill="#c0a8ff" opacity="0.9"/>
    <circle cx="880" cy="132" r="3" fill="#ffbd96" opacity="0.8"/>
  </g>
  <rect x="0.75" y="0.75" width="918.5" height="202.5" rx="21.25" fill="none" stroke="#34435d" stroke-width="1.5"/>

  <g transform="translate(42 44)">
    <rect width="116" height="116" rx="28" fill="#192842" stroke="#5b83a9" stroke-width="1.5"/>
    <circle cx="58" cy="58" r="41" fill="#111a2b" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="58" cy="58" r="30" fill="none" stroke="#8edce9" stroke-opacity="0.35" stroke-width="1.4"/>
    <circle cx="58" cy="58" r="19" fill="none" stroke="#b9a4ff" stroke-opacity="0.42" stroke-width="1.4"/>
    <path d="M58 58 87 29A41 41 0 0 1 99 54Z" fill="url(#accent)" opacity="0.25"/>
    <path d="M58 58 87 29" fill="none" stroke="url(#accent)" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="58" cy="58" r="9" fill="#192842" stroke="#a9e8f5" stroke-width="2"/>
    <circle cx="58" cy="58" r="3" fill="#f5f8ff"/>
    <circle cx="80" cy="36" r="4.5" fill="#9eeaf0"/>
    <circle cx="40" cy="73" r="3" fill="#c2a8ff"/>
  </g>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="186" y="82" font-size="42" font-weight="800" letter-spacing="-0.9" fill="#f4f7ff">MissNix</text>
    <rect x="372" y="58" width="126" height="25" rx="12.5" fill="#24394f" stroke="#4b8496"/>
    <text x="435" y="75" text-anchor="middle" font-size="10.5" font-weight="750" letter-spacing="0.7" fill="#a2eaf1">RELEASE RADAR</text>
    <text x="188" y="113" font-size="15" font-weight="500" fill="#cbd8e9">Your music collection, one step ahead of new releases.</text>

    <g transform="translate(188 133)" font-size="11" font-weight="650">
      <rect width="122" height="28" rx="14" fill="#1b3442" stroke="#386979"/>
      <circle cx="15" cy="14" r="3.5" fill="#6fe2e6"/>
      <text x="26" y="18" fill="#dcf8fa">Library sync</text>
      <rect x="130" width="127" height="28" rx="14" fill="#302947" stroke="#655b8e"/>
      <circle cx="145" cy="14" r="3.5" fill="#c0a4ff"/>
      <text x="156" y="18" fill="#f1eaff">New releases</text>
      <rect x="265" width="126" height="28" rx="14" fill="#3a2a38" stroke="#84566a"/>
      <circle cx="280" cy="14" r="3.5" fill="#ffafbb"/>
      <text x="291" y="18" fill="#fff0f2">30s previews</text>
      <rect x="399" width="145" height="28" rx="14" fill="#223a36" stroke="#46786c"/>
      <circle cx="414" cy="14" r="3.5" fill="#89e4bd"/>
      <text x="425" y="18" fill="#e5fff4">No account needed</text>
    </g>
  </g>
</svg>
