[package]
name = "missnix-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core library scanner, SQLite state persistence, smart deduplication, and Deezer/MusicBrainz release radar engine for MissNix"
repository = "https://github.com/Irgendeinwer/MissNix"
homepage = "https://github.com/Irgendeinwer/MissNix"

[dependencies]
dirs = "6.0"
lofty = "0.25"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }
walkdir = "2.5"
