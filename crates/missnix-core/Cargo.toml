[package]
name = "missnix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library scanner, SQLite persistence, deduplication, and Deezer/MusicBrainz sync engine for MissNix."
repository.workspace = true

[dependencies]
dirs = "7.0.0"
lofty = "0.25.5"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip", "json"] }
walkdir = "2.5.1"
